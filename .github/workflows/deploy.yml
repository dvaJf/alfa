name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # For user repos the image is ghcr.io/<user>/<repo>; for org repos the
          # token can't be lowercase, so build from the lowercased owner separately.
          tags: |
            ghcr.io/dvajf/alfa:latest
            ghcr.io/dvajf/alfa:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Upload compose + deploy script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.prod.yml,deploy/deploy.sh"
          target: "~/app"
          strip_components: 0
      - name: Remote deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            chmod +x ~/app/deploy/deploy.sh
            IMAGE=ghcr.io/dvajf/alfa:${{ github.sha }} \
            OWNER=${{ github.repository_owner }} \
            ACTOR=${{ github.actor }} \
            GHCR_TOKEN=${{ secrets.GITHUB_TOKEN }} \
            bash ~/app/deploy/deploy.sh
